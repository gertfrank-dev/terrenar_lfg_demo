{% load static %}<figure class="retrato{% if chico %} chico{% endif %}">{% if p.retrato %}<img src="{{ p.retrato.url }}" alt="Retrato del personaje de {{ p.alias }}" loading="lazy" width="160" height="200">{% elif p.retrato_demo %}<img src="{% static 'demo/' %}{{ p.retrato_demo }}" alt="Retrato del personaje de {{ p.alias }}" loading="lazy" width="160" height="200">{% else %}<span class="monograma" aria-hidden="true">{{ p.alias|first }}</span>{% endif %}</figure>
